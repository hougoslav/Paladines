# Télécharge les rues et chemins à pied de Lille (OpenStreetMap) et enregistre data/chemins.json :
# l'appli s'en sert pour calculer l'itinéraire et guider pas à pas, même sans internet.
# Refait chaque mois (les rues changent peu) et à chaque changement de l'outil.
name: Chemins à pied

on:
  push:
    paths:
      - outils/chemins.mjs
      - .github/workflows/chemins.yml
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chemins-${{ github.ref }}

jobs:
  chemins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extrait OpenStreetMap de la région (Geofabrik), découpé autour de Lille
        id: extrait
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL --retry 3 -o region.osm.pbf https://download.geofabrik.de/europe/france/nord-pas-de-calais-latest.osm.pbf
          osmium extract -b "$(node outils/chemins.mjs --zone)" region.osm.pbf -o zone.osm.pbf
          osmium tags-filter zone.osm.pbf w/highway -o rues.osm.pbf
          osmium cat rues.osm.pbf -f opl -o rues.opl
      - name: Construire le graphe des chemins
        run: |
          if [ "${{ steps.extrait.outcome }}" = "success" ]; then node outils/chemins.mjs rues.opl
          else node outils/chemins.mjs; fi
      - name: Enregistrer
        run: |
          git add -N data/chemins.json
          if git diff --quiet data/chemins.json; then echo "Chemins inchangés"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chemins.json
          git commit -m "Chemins à pied de Lille (OpenStreetMap)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
